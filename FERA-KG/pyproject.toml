[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fera-kg"
version = "0.1.0"
description = "Evidence-grounded relation verification with target-edge-deleted knowledge graphs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "All rights reserved until a release license is selected."}
authors = []
dependencies = ["openpyxl>=3.1", "scikit-learn>=1.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
